<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AES y RSA</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="container">
    <header>
      <div class="logo">E3. Prototipo de algoritmos criptográficos</div>
    </header>
    <section class="panel">
      <label for="algorithm">Algoritmo de cifrado</label>
      <select id="algorithm">
        <option value="aes">AES-256-GCM · clave simetrica</option>
        <option value="rsa">RSA-OAEP · clave publica y privada</option>
      </select>
      <div class="actions"><button id="generate">Generar claves</button><button id="clear"
          class="secondary">Limpiar</button></div>
      <div id="aesFields"><label for="aesKey">Clave AES (Base64)</label><textarea id="aesKey" rows="2"
          spellcheck="false" placeholder="Genera una clave AES"></textarea></div>
      <div id="rsaFields" hidden><label for="publicKey">Clave publica RSA (PEM)</label><textarea id="publicKey" rows="5"
          spellcheck="false" placeholder="Genera un par de claves"></textarea><label for="privateKey">Clave privada RSA
          (PEM)</label><textarea id="privateKey" rows="6" spellcheck="false"
          placeholder="No compartas esta clave"></textarea></div>
      <label for="message">Mensaje original</label><textarea id="message" rows="4"
        placeholder="Escribe un mensaje para cifrar..."></textarea>
      <button id="encrypt">Cifrar mensaje</button>
      <label for="ciphertext">Texto cifrado (Base64)</label><textarea id="ciphertext" rows="5" spellcheck="false"
        placeholder="El resultado cifrado aparecerá aquí; también puedes pegar un texto cifrado válido"></textarea>
      <button id="decrypt" class="secondary">Descifrar mensaje</button>
      <label for="plaintext">Mensaje descifrado</label><textarea id="plaintext" rows="3" readonly
        placeholder="El mensaje recuperado aparecerá aquí"></textarea>
      <div id="status" role="status" aria-live="polite"></div>
    </section>
  </main>
</body>

</html>
